services:
    api:
        build: .
        environment:
            NODE_ENV: production
            PORT: 3000
            CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:3000}
            STORAGE: postgres
            DATABASE_URL: postgres://roamboard:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/roamboard
            DEBUG: roamboard:*
            GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:-}
            MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:-}
            MAPBOX_PUBLIC_TOKEN: ${MAPBOX_PUBLIC_TOKEN:-}
            UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
            GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
            CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
            CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
            CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
        ports:
            - "127.0.0.1:3001:3000"
        depends_on:
            postgres:
                condition: service_healthy

    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: roamboard
            POSTGRES_USER: roamboard
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
        ports:
            - "127.0.0.1:5433:5432"
        volumes:
            - roamboard-postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U roamboard -d roamboard"]
            interval: 5s
            timeout: 3s
            retries: 20

    adminer:
        image: adminer:5.5.1-standalone
        environment:
            ADMINER_DEFAULT_SERVER: postgres
        ports:
            - "127.0.0.1:8080:8080"
        depends_on:
            postgres:
                condition: service_healthy

volumes:
    roamboard-postgres-data:
