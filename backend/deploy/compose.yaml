name: roamboard-db

services:
    postgres:
        image: postgres:17-bookworm
        restart: unless-stopped
        environment:
            POSTGRES_DB: roamboard_dev
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in backend/.env}
            ROAMBOARD_DB_PASSWORD: ${ROAMBOARD_DB_PASSWORD:?Set ROAMBOARD_DB_PASSWORD in backend/.env}
        ports:
            - "127.0.0.1:5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./init-db.sh:/docker-entrypoint-initdb.d/001-init.sh:ro
            - ../db/migrations:/roamboard-migrations:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d roamboard_dev"]
            interval: 10s
            timeout: 5s
            retries: 5

    backend:
        image: ghcr.io/roamboard/roamboard-backend:${IMAGE_TAG:?Set IMAGE_TAG in backend/.env to the commit SHA to deploy}
        build:
            context: ../..
            dockerfile: backend/Dockerfile
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
        env_file:
            - ../.env
        environment:
            NODE_ENV: ${NODE_ENV:-production}
            PORT: 3001
            CLIENT_ORIGIN: https://${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in backend/.env}
            DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL in backend/.env (using @postgres:5432)}

    frontend:
        image: ghcr.io/roamboard/roamboard-frontend:${IMAGE_TAG:?Set IMAGE_TAG in backend/.env to the commit SHA to deploy}
        build:
            context: ../..
            dockerfile: frontend/Dockerfile
            args:
                NEXT_PUBLIC_API_URL: https://${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in backend/.env}
                NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        restart: unless-stopped
        depends_on:
            - backend
        environment:
            NODE_ENV: production
            PORT: 3000
            HOSTNAME: 0.0.0.0

    caddy:
        image: caddy:2-alpine
        restart: unless-stopped
        depends_on:
            - frontend
            - backend
        ports:
            - "80:80"
            - "443:443"
        environment:
            PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in backend/.env}
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy_data:/data
            - caddy_config:/config

volumes:
    postgres_data:
    caddy_data:
    caddy_config:
