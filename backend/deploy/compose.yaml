name: roamboard-db

services:
    postgres:
        image: postgres:17-bookworm
        restart: unless-stopped
        environment:
            POSTGRES_DB: roamboard_dev
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in backend/.env}
            ROAMBOARD_DB_PASSWORD: ${ROAMBOARD_DB_PASSWORD:?Set ROAMBOARD_DB_PASSWORD in backend/.env}
        ports:
            - "127.0.0.1:5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./init-db.sh:/docker-entrypoint-initdb.d/001-init.sh:ro
            - ../db/migrations:/roamboard-migrations:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d roamboard_dev"]
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    postgres_data:
