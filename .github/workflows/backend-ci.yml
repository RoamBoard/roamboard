name: Backend CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    backend-checks:
        name: Backend Lint, Typecheck, Test & Build
        runs-on: ubuntu-latest
        timeout-minutes: 10

        defaults:
            run:
                working-directory: backend

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Install pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 12.5.1
                  run_install: false

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: backend/package-lock.json

            - name: Install shared lint and formatting dependencies
              working-directory: .
              run: pnpm install --frozen-lockfile

            - name: Install dependencies
              run: npm ci

            - name: Run ESLint
              run: npm run lint

            - name: Type-check
              run: npm run typecheck

            - name: Run tests
              run: npm test

            - name: Build backend
              run: npm run build
