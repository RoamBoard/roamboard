name: Formatting CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    formatting:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Install pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 12.5.1
                  run_install: false

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml

            - name: Install root formatting dependencies
              run: pnpm install --frozen-lockfile

            - name: Check frontend and backend formatting
              run: pnpm format:apps:check
